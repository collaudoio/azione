# IL WORKFLOW FIDATO DI COLLAUDO (C-0049) — si pubblica in `collaudoio/azione` come
# `.github/workflows/collaudo.yml` (scripts/pubblica-azione.sh) e il repository del cliente lo RICHIAMA:
#
#   on: { push: {}, workflow_dispatch: {} }
#   permissions: { contents: read, id-token: write }
#   jobs:
#     collaudo:
#       uses: collaudoio/azione/.github/workflows/collaudo.yml@v1
#
# Il contratto lo trova il servizio dal repository; nella beta il cliente lo apre spingendo
# `.collaudo/contratto.json` sul ramo principale (C-0053).
#
# Il token OIDC di questi job porta `job_workflow_ref: collaudoio/azione/.github/workflows/collaudo.yml@refs/tags/v1`
# e il servizio non dà ordini a nessun altro (`WORKFLOW_FIDATI`): un workflow scritto a mano nel repository
# del cliente, che spedisse risultati inventati con un token vero, porterebbe il proprio nome. Qui i passi
# sono NOSTRI: le azioni fissate per sha, l'azione di Collaudo fissata per sha, il servizio non si sceglie,
# la macchina è di GitHub.
#
# TRE job (C-0056): il codice del cliente (installazione e suite) gira SOLO nel job `suite`, che non ha
# `id-token`: su quella macchina le variabili del token non esistono, e il codice consegnato non può
# coniarne uno per parlare col servizio da solo. L'ordine lo chiede il job `ordine`, i fatti li spedisce
# il job `spedisci`: tutt'e due col token e senza checkout né `run:`. Ciò che la consegna cambia sta nel
# diff che il servizio legge e i rilevatori guardano (`manomissione-esecuzione`).
#
# COME si esegue la suite (il runner e le sue opzioni, l'installazione, Node) sta nel CONTRATTO (C-0085), non in
# questi input: il workflow chiamante sta nel ramo di chi consegna, che li cambierebbe dalla sua pull request. Il
# servizio li manda con l'ordine: il job `ordine` dà Node al job `suite`, l'azione esegue installazione e suite.
# `node-version`, `installa` e `comando` restano dichiarati perché un chiamante di prima che li passa non si rompa,
# ma non valgono più.
name: collaudo

on:
  workflow_call:
    inputs:
      contratto:
        description: "L'identificativo del contratto Collaudo. Facoltativo: senza, lo trova il servizio dal repository."
        required: false
        type: string
        default: ""
      node-version:
        description: "Non vale più (C-0085): la versione di Node sta nel contratto, `esecuzione.node`."
        required: false
        type: string
        default: ""
      installa:
        description: "Non vale più (C-0085): l'installazione sta nel contratto, `esecuzione.installa`."
        required: false
        type: string
        default: ""
      comando:
        description: "Non vale più (C-0085): il runner e le sue opzioni stanno nel contratto, `esecuzione.runner` e `esecuzione.opzioni`."
        required: false
        type: string
        default: ""
      uso-ai:
        description: "Solo senza l'app GitHub (con l'app vale la casella nella PR, C-0030): true/false."
        required: false
        type: string
        default: ""
    outputs:
      codice:
        description: "Quando non c'è niente da fare, il perché in un codice stabile (`nessun-contratto`, `ramo-principale`, `ha-contestato`…); vuoto quando Collaudo ha eseguito un ordine."
        value: ${{ jobs.ordine.outputs.codice }}

jobs:
  ordine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    outputs:
      ordine: ${{ steps.ordine.outputs.ordine }}
      # Il codice stabile del «niente da fare» (`ramo-principale`, `ha-contestato`…), vuoto quando c'è un ordine.
      codice: ${{ steps.ordine.outputs.codice }}
      # La versione di Node, dalla clausola del contratto (C-0085): `setup-node` nel job `suite` la prende da qui.
      node: ${{ steps.ordine.outputs.node }}
    steps:
      - id: ordine
        uses: collaudoio/azione@3b1877cf0c6fc8ebc0a6109e4c911d3cdad4bc17
        with:
          fase: ordine
          cartella: ${{ runner.temp }}/collaudo
          contratto: ${{ inputs.contratto }}
      - if: steps.ordine.outputs.ordine == 'si'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collaudo-ordine
          path: ${{ runner.temp }}/collaudo/ordine.json
          if-no-files-found: error
          retention-days: 1

  suite:
    needs: ordine
    if: needs.ordine.outputs.ordine == 'si'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.ordine.outputs.node }}
      # Nessun passo `run:` (C-0085, Fable): l'installazione la esegue l'AZIONE, con l'ambiente chiuso e dopo aver
      # tolto l'ordine dal disco. Un passo `run:` avrebbe l'ambiente pieno del runner: un `postinstall` scriverebbe in
      # `$GITHUB_PATH` e `$GITHUB_ENV` per il passo dell'azione, e col token degli artefatti scaricherebbe l'ordine.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: collaudo-ordine
          path: ${{ runner.temp }}/collaudo
      - uses: collaudoio/azione@3b1877cf0c6fc8ebc0a6109e4c911d3cdad4bc17
        with:
          fase: esegui
          cartella: ${{ runner.temp }}/collaudo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collaudo-fatti
          path: ${{ runner.temp }}/collaudo/fatti.json
          if-no-files-found: error
          retention-days: 1

  spedisci:
    needs: [ordine, suite]
    if: needs.ordine.outputs.ordine == 'si'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: collaudo-ordine
          path: ${{ runner.temp }}/collaudo
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: collaudo-fatti
          path: ${{ runner.temp }}/collaudo
      - uses: collaudoio/azione@3b1877cf0c6fc8ebc0a6109e4c911d3cdad4bc17
        with:
          fase: spedisci
          cartella: ${{ runner.temp }}/collaudo
          uso-ai: ${{ inputs.uso-ai }}
