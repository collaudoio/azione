# IL WORKFLOW FIDATO DI COLLAUDO (C-0049) — si pubblica in `collaudoio/azione` come
# `.github/workflows/collaudo.yml` (scripts/pubblica-azione.sh) e il repository del cliente lo RICHIAMA:
#
#   on: { push: {}, workflow_dispatch: {} }
#   permissions: { contents: read, id-token: write }
#   jobs:
#     collaudo:
#       uses: collaudoio/azione/.github/workflows/collaudo.yml@v1
#
# Il contratto lo trova il servizio dal repository; nella beta il cliente lo apre spingendo
# `.collaudo/contratto.json` sul ramo principale (C-0053).
#
# Il token OIDC di questi job porta `job_workflow_ref: collaudoio/azione/.github/workflows/collaudo.yml@refs/tags/v1`
# e il servizio non dà ordini a nessun altro (`WORKFLOW_FIDATI`): un workflow scritto a mano nel repository
# del cliente, che spedisse risultati inventati con un token vero, porterebbe il proprio nome. Qui i passi
# sono NOSTRI: le azioni fissate per sha, l'azione di Collaudo fissata per sha, il servizio non si sceglie,
# la macchina è di GitHub.
#
# TRE job (C-0056): il codice del cliente (installazione e suite) gira SOLO nel job `suite`, che non ha
# `id-token`: su quella macchina le variabili del token non esistono, e il codice consegnato non può
# coniarne uno per parlare col servizio da solo. L'ordine lo chiede il job `ordine`, i fatti li spedisce
# il job `spedisci`: tutt'e due col token e senza checkout né `run:`. Ciò che la consegna cambia sta nel
# diff che il servizio legge e i rilevatori guardano (`manomissione-esecuzione`).
name: collaudo

on:
  workflow_call:
    inputs:
      contratto:
        description: "L'identificativo del contratto Collaudo. Facoltativo: senza, lo trova il servizio dal repository."
        required: false
        type: string
        default: ""
      node-version:
        description: "La versione di Node del progetto."
        required: false
        type: string
        default: "24"
      installa:
        description: "Il comando che installa le dipendenze."
        required: false
        type: string
        default: "npm ci"
      comando:
        description: "Il comando della suite col reporter JSON; segnaposto {uscita} e {file}."
        required: false
        type: string
        default: "npx vitest run --reporter=json --outputFile={uscita} {file}"
      uso-ai:
        description: "Solo senza l'app GitHub (con l'app vale la casella nella PR, C-0030): true/false."
        required: false
        type: string
        default: ""

jobs:
  ordine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    outputs:
      ordine: ${{ steps.ordine.outputs.ordine }}
    steps:
      - id: ordine
        uses: collaudoio/azione@401d13dabcd2c49805b23d4d3e89f6684c91550b
        with:
          fase: ordine
          cartella: ${{ runner.temp }}/collaudo
          contratto: ${{ inputs.contratto }}
      - if: steps.ordine.outputs.ordine == 'si'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collaudo-ordine
          path: ${{ runner.temp }}/collaudo/ordine.json
          if-no-files-found: error
          retention-days: 1

  suite:
    needs: ordine
    if: needs.ordine.outputs.ordine == 'si'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: collaudo-ordine
          path: ${{ runner.temp }}/collaudo
      - name: installa
        env:
          INSTALLA: ${{ inputs.installa }}
        run: bash -c "$INSTALLA"
      - uses: collaudoio/azione@401d13dabcd2c49805b23d4d3e89f6684c91550b
        with:
          fase: esegui
          cartella: ${{ runner.temp }}/collaudo
          comando: ${{ inputs.comando }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collaudo-fatti
          path: ${{ runner.temp }}/collaudo/fatti.json
          if-no-files-found: error
          retention-days: 1

  spedisci:
    needs: [ordine, suite]
    if: needs.ordine.outputs.ordine == 'si'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: collaudo-ordine
          path: ${{ runner.temp }}/collaudo
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: collaudo-fatti
          path: ${{ runner.temp }}/collaudo
      - uses: collaudoio/azione@401d13dabcd2c49805b23d4d3e89f6684c91550b
        with:
          fase: spedisci
          cartella: ${{ runner.temp }}/collaudo
          uso-ai: ${{ inputs.uso-ai }}
