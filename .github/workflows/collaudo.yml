# IL WORKFLOW FIDATO DI COLLAUDO (C-0049) — si pubblica in `collaudoio/azione` come
# `.github/workflows/collaudo.yml` (scripts/pubblica-azione.sh) e il repository del cliente lo RICHIAMA:
#
#   on: { push: {}, workflow_dispatch: {} }
#   permissions: { contents: read, id-token: write }
#   jobs:
#     collaudo:
#       uses: collaudoio/azione/.github/workflows/collaudo.yml@v1
#
# Il contratto lo trova il servizio dal repository; nella beta il cliente lo apre spingendo
# `.collaudo/contratto.json` sul ramo principale (C-0053).
#
# Il token OIDC di questo job porta `job_workflow_ref: collaudoio/azione/.github/workflows/collaudo.yml@refs/tags/v1`
# e il servizio non dà ordini a nessun altro (`WORKFLOW_FIDATI`): un workflow scritto a mano nel repository
# del cliente, che spedisse risultati inventati con un token vero, porterebbe il proprio nome. Qui i passi
# sono NOSTRI: le azioni fissate per sha, l'azione di Collaudo fissata per sha, il servizio non si sceglie,
# la macchina è di GitHub. Il codice del cliente gira (installazione e suite): è quello del commit, e ciò
# che la consegna vi cambia sta nel diff che il servizio legge e i rilevatori guardano.
name: collaudo

on:
  workflow_call:
    inputs:
      contratto:
        description: "L'identificativo del contratto Collaudo. Facoltativo: senza, lo trova il servizio dal repository."
        required: false
        type: string
        default: ""
      node-version:
        description: "La versione di Node del progetto."
        required: false
        type: string
        default: "24"
      installa:
        description: "Il comando che installa le dipendenze."
        required: false
        type: string
        default: "npm ci"
      comando:
        description: "Il comando della suite col reporter JSON; segnaposto {uscita} e {file}."
        required: false
        type: string
        default: "npx vitest run --reporter=json --outputFile={uscita} {file}"
      uso-ai:
        description: "Solo senza l'app GitHub (con l'app vale la casella nella PR, C-0030): true/false."
        required: false
        type: string
        default: ""

jobs:
  collaudo:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: installa
        env:
          INSTALLA: ${{ inputs.installa }}
        run: bash -c "$INSTALLA"
      - uses: collaudoio/azione@cf19703adcdc5280ba08aa096fda6950ee4fc1c4
        with:
          contratto: ${{ inputs.contratto }}
          comando: ${{ inputs.comando }}
          uso-ai: ${{ inputs.uso-ai }}
