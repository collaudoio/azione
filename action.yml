# collaudoio/azione — esegue l'ORDINE del servizio di Collaudo NELLA CI del cliente e spedisce i fatti
# grezzi. È muta: non giudica niente, il giudizio sta nel servizio (C-0039, C-0043). Il job che la usa dichiara:
#   permissions: { contents: read, id-token: write }
# e nient'altro: l'azione non scrive nel repository e non ha token con potere di scrittura.
name: "Collaudo"
description: "Esegue l'ordine del servizio di Collaudo (prova, suite, toppe) e spedisce i fatti grezzi, firmati dall'identità OIDC del workflow."
author: "collaudoio"
inputs:
  contratto:
    description: "L'identificativo del contratto Collaudo."
    required: true
  servizio:
    description: "L'indirizzo del servizio dei verdetti."
    required: false
    default: "https://api.collaudo.io"
  comando:
    description: "Il comando della suite col reporter JSON; segnaposto {uscita} e {file}."
    required: false
    default: "npx vitest run --reporter=json --outputFile={uscita} {file}"
  uso-ai:
    description: "Solo alla consegna e SOLO se il servizio non ha l'app GitHub (con l'app vale la casella nella descrizione della PR, C-0030): il produttore dichiara se ha usato l'AI (true/false)."
    required: false
runs:
  using: "node24"
  main: "dist/main.js"
